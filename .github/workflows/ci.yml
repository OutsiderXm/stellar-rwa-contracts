name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads rust-toolchain.toml and installs/activates exactly the channel,
      # targets, and components pinned there, so CI can't drift onto a newer
      # `stable` than the one contributors build against locally.
      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Tests run before the formatting gate. A cosmetic `cargo fmt` failure
      # used to abort the job at the first step, so `cargo test` never ran and
      # broken code merged unnoticed. Formatting is still enforced, but it can
      # no longer mask a compile or test failure.
      - name: Test
        run: cargo test --workspace

      # Committed test_snapshots must match what the tests actually produce, so
      # drift (e.g. a storage layout change without regenerated snapshots)
      # fails CI instead of silently leaving every contributor's tree dirty.
      - name: Check working tree is clean after tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "cargo test left the working tree dirty. Regenerate and commit test_snapshots:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}

      # Build the contracts to Wasm directly with cargo. This verifies the same
      # artifacts as `stellar contract build` without compiling the full Stellar
      # CLI from source (which needs the libdbus system library and is slow).
      - name: Build contracts (wasm)
        run: cargo build --workspace --release --target wasm32v1-none

      # Issue #374: Track WASM contract sizes
      - name: Report WASM contract sizes
        run: |
          echo "## Contract WASM Sizes" >> $GITHUB_STEP_SUMMARY
          for contract in compliance asset-token registry dividend; do
            wasm_file="target/wasm32v1-none/release/${contract}.wasm"
            if [ -f "$wasm_file" ]; then
              size=$(wc -c < "$wasm_file")
              size_kb=$((size / 1024))
              echo "- **$contract**: ${size_kb}KB" >> $GITHUB_STEP_SUMMARY
              if [ $size_kb -gt 500 ]; then
                echo "  ⚠️  Exceeds 500KB threshold" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      # Report-only for now: prints a per-crate summary to the job's PR check
      # so reviewers have a coverage signal. No floor is enforced yet -- that
      # needs a separate discussion to agree a sane threshold first.
      - name: Generate coverage summary
        run: |
          {
            echo "### Coverage summary"
            echo '```'
            cargo llvm-cov --workspace --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
